</head>
<body class="bg-[#0b0f14] text-[#cbd5e1] font-sans antialiased">

    <!-- Root App Target -->
    <div id="root"></div>

    <!-- React App Initialization & Logic -->
    <script type="text/babel">
        // Sample Portfolio Data - Replace this array with your actual projects and findings
        const initialProjects = [
            {
                id: "case-001",
                title: "Trace Labs Global OSINT Search Party",
                category: "OSINT",
                severity: "high",
                date: "2026-05",
                summary: "Conducted missing persons investigations using advanced open-source intelligence methodologies, pivoting through social media footprints, domain records, and metadata analytics.",
                tags: ["Trace Labs", "OPSEC", "Sockpuppets", "Pivot Analysis"]
            },
            {
                id: "ctf-024",
                title: "Windows Event Log Forensics & Timeline Reconstruction",
                category: "DFIR",
                severity: "medium",
                date: "2026-04",
                summary: "Analyzed EVTX artifacts to trace a lateral movement event. Reconstructed the attacker timeline by isolating Event IDs 4624 (Successful Logon) and 4625 (Failed Logon).",
                tags: ["Blue Team", "Event Logs", "Incident Response"]
            },
            {
                id: "inf-009",
                title: "Automated AWS IAM Rule Auditor",
                category: "Cloud",
                severity: "low",
                date: "2026-03",
                summary: "Developed a Python-driven automation script utilizing Boto3 to audit IAM policies against security baselines, flagging over-privileged service roles.",
                tags: ["Python", "AWS", "IAM", "Boto3"]
            }
        ];

        function SocPortfolio() {
            const [projects, setProjects] = React.useState(initialProjects);
            const [filter, setFilter] = React.useState("ALL");

            const filteredProjects = filter === "ALL" 
                ? projects 
                : projects.filter(p => p.category === filter);

            // Severity color helper mapping to the custom CSS variables
            const getSevClass = (sev) => {
                if (sev === "high") return "border-l-4 border-[#ff4d4d] bg-[#ff4d4d]/5";
                if (sev === "medium") return "border-l-4 border-[#ffb900] bg-[#ffb900]/5";
                return "border-l-4 border-[#22e1ff] bg-[#22e1ff]/5";
            };

            return (
                <div class="min-h-screen relative overflow-hidden pb-12">
                    {/* Hex Grid Overlay Element */}
                    <div class="absolute inset-0 opacity-15 pointer-events-none bg-[radial-gradient(ellipse_at_center,rgba(34,225,255,0.1)_0%,transparent_70%)]"></div>

                    {/* Top Terminal Status Header */}
                    <header class="border-b border-[#1e293b] bg-[#0f172a]/80 backdrop-blur sticky top-0 z-50 px-6 py-4">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-3">
                                    <span class="w-2.5 h-2.5 rounded-full bg-[#10b981] animate-pulse"></span>
                                    <h1 class="text-xl font-mono font-bold tracking-wide text-[#22e1ff]">SEC_OPS // MAIN_CONSOLE</h1>
                                </div>
                                <p class="text-xs font-mono text-[#64748b] mt-1">OPERATOR: ENREQUE COLEMAN | LOCATION: COR-CAN-01</p>
                            </div>
                            
                            {/* Filter Deck */}
                            <div class="flex flex-wrap gap-2 font-mono text-xs">
                                {["ALL", "OSINT", "DFIR", "Cloud"].map(cat => (
                                    <button 
                                        key={cat}
                                        onClick={() => setFilter(cat)}
                                        class={`px-3 py-1.5 border transition-all ${
                                            filter === cat 
                                                ? "bg-[#22e1ff]/10 border-[#22e1ff] text-[#22e1ff] shadow-[0_0_10px_rgba(34,225,255,0.2)]" 
                                                : "border-[#1e293b] text-[#64748b] hover:border-[#475569] hover:text-[#cbd5e1]"
                                        }`}
                                    >
                                        [{cat}]
                                    </button>
                                ))}
                            </div>
                        </div>
                    </header>

                    {/* Console Main Workspace */}
                    <main class="max-w-7xl mx-auto px-6 mt-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
                        
                        {/* Left Column: Operator Profile & Metrics */}
                        <section class="lg:col-span-1 space-y-6">
                            <div class="border border-[#1e293b] bg-[#0f172a]/40 p-5 rounded-sm">
                                <h2 class="text-xs font-mono font-semibold tracking-wider text-[#64748b] uppercase mb-4">// INTEL_PROFILE</h2>
                                <div class="space-y-3 font-mono text-xs">
                                    <div>
                                        <div class="text-[#64748b]">SPECIALIZATION:</div>
                                        <div class="text-[#cbd5e1]">Digital Forensics / SOC / Cloud Security</div>
                                    </div>
                                    <div>
                                        <div class="text-[#64748b]">STATUS:</div>
                                        <div class="text-[#10b981]">ACTIVE // TRIAGING_CASES</div>
                                    </div>
                                    <div class="pt-2 border-t border-[#1e293b] flex gap-3 text-sm text-[#22e1ff]">
                                        <a href="#" class="hover:underline">GitHub</a>
                                        <a href="#" class="hover:underline">LinkedIn</a>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Right Column: Case Logs / Project Feed */}
                        <section class="lg:col-span-3 space-y-4">
                            <div class="flex items-center justify-between border-b border-[#1e293b] pb-2">
                                <h2 class="text-sm font-mono font-bold text-[#64748b] uppercase">// DEPLOYED_CASE_LOGS ({filteredProjects.length})</h2>
                                <span class="text-xs font-mono text-[#22e1ff]">SYSTEM_OK</span>
                            </div>

                            {filteredProjects.length === 0 ? (
                                <div class="border border-dashed border-[#1e293b] p-12 text-center text-sm font-mono text-[#64748b]">
                                    NO RECORDED ARTIFACTS MATCHING THE SELECTION FILTER
                                </div>
                            ) : (
                                filteredProjects.map(project => (
                                    <article 
                                        key={project.id}
                                        class={`border border-[#1e293b] bg-[#0f172a]/20 p-5 transition-all hover:border-[#334155] ${getSevClass(project.severity)}`}
                                    >
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                            <div class="flex items-center gap-3">
                                                <span class="font-mono text-xs text-[#22e1ff] px-2 py-0.5 bg-[#22e1ff]/5 border border-[#22e1ff]/20">
                                                    {project.id}
                                                </span>
                                                <h3 class="text-base font-semibold text-[#f1f5f9] tracking-tight hover:text-[#22e1ff] cursor-pointer">
                                                    {project.title}
                                                </h3>
                                            </div>
                                            <div class="flex items-center gap-4 font-mono text-xs text-[#64748b]">
                                                <span>[{project.category}]</span>
                                                <span>{project.date}</span>
                                            </div>
                                        </div>

                                        <p class="text-sm text-[#94a3b8] leading-relaxed mb-4">
                                            {project.summary}
                                        </p>

                                        <div class="flex flex-wrap gap-2">
                                            {project.tags.map(tag => (
                                                <span key={tag} class="font-mono text-[11px] px-2 py-0.5 bg-[#1e293b] text-[#94a3b8] border border-[#334155]/30">
                                                    #{tag}
                                                </span>
                                            ))}
                                        </div>
                                    </article>
                                ))
                            )}
                        </section>
                    </main>
                </div>
            );
        }

        ReactDOM.render(<SocPortfolio />, document.getElementById('root'));
    </script>
</body>
</html>
